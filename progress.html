<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress · Kodingu</title>
  <meta name="description" content="Your Kodingu XP, tokens, weekly league, daily missions, certificates, and history. Saved in this browser.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://kodingu.pages.dev/progress">
  <meta property="og:site_name" content="Kodingu">
  <meta property="og:locale" content="en">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kodingu.pages.dev/progress">
  <meta property="og:title" content="Progress · Kodingu">
  <meta property="og:description" content="Your Kodingu XP, tokens, weekly league, daily missions, certificates, and history. Saved in this browser.">
  <meta property="og:image" content="https://kodingu.pages.dev/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kodingu, a quiet place to learn HTML, CSS, and JavaScript.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Progress · Kodingu">
  <meta name="twitter:description" content="Your Kodingu XP, tokens, weekly league, daily missions, certificates, and history. Saved in this browser.">
  <meta name="twitter:image" content="https://kodingu.pages.dev/assets/og-image.png">
  <meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191817" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="assets/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="module" src="assets/js/progress.js"></script>
</head>
<body>
  <noscript><p class="noscript">Kodingu needs JavaScript to read your local progress. Please turn it on.</p></noscript>
  <div id="site-header"></div>

  <main id="main">
    <div class="shell page-head">
      <p class="section-label">Progress</p>
      <h1>Your progress</h1>
      <p class="lede">Everything here is stored in this browser. There is no account and no sync.</p>
    </div>

    <div class="shell">
      <div class="stats-strip" id="stats"></div>
      <section class="progress-section" id="rewards" aria-labelledby="rewards-heading"></section>
      <section class="progress-section" id="missions" aria-labelledby="missions-heading"></section>
      <section class="progress-section" id="courses" aria-labelledby="courses-heading"></section>
      <section class="progress-section" id="certificates" aria-labelledby="certificates-heading"></section>
      <section class="progress-section" id="history-section" aria-labelledby="history-heading"></section>

      <div class="data-note" id="data-note">
        <p>Progress is saved as <code>kodingu.progress.v1</code> in this browser. Clearing site data removes it.</p>
        <button class="button button-secondary button-small" id="reset-progress" type="button">Reset progress</button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <output class="toast" id="toast" aria-live="polite"></output>
</body>
</html>
