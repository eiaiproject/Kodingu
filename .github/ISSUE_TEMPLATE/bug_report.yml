name: Bug report
description: Report a broken page, editor, or check.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, use [SECURITY.md](../blob/main/SECURITY.md) instead of a public issue.
  - type: input
    id: page
    attributes:
      label: Page or lesson
      description: The URL, lesson ID, challenge ID, or project ID.
      placeholder: /lesson?course=css&lesson=css-05
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Select Check
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 142 on macOS 15
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Console output or screenshots
      description: Remove personal data before posting.
    validations:
      required: false
